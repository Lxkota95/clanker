[package]
name = "clanker"
version = "0.1.0"
edition = "2024"
# Lowest Rust the latest dependencies support (icu_*, time); checked in CI. An application, so
# dependencies stay current rather than being held back for an older compiler.
rust-version = "1.88"
description = "A Discord bot, written to learn tokio and async Rust"
license = "MIT"
repository = "https://github.com/Lxkota95/clanker"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
poise = "0.7"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
